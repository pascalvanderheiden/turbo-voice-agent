services:
  cosmos-emulator:
    image: mcr.microsoft.com/cosmosdb/linux/azure-cosmos-emulator:vnext-preview
    container_name: cosmos-emulator
    platform: linux/amd64
    ports:
      - "8081:8081"
      - "1234:1234"
    environment:
      - AZURE_COSMOS_EMULATOR_ENABLE_DATA_PERSISTENCE=true
    volumes:
      - cosmos-data:/tmp/cosmos/appdata
    mem_limit: 4g
    cpus: 2.0
    healthcheck:
      test: ["CMD", "curl", "-fk", "https://localhost:8081/_explorer/emulator.pem"]
      interval: 15s
      timeout: 10s
      retries: 40
      start_period: 120s

  sandbox:
    build:
      context: ./sandbox
      dockerfile: Dockerfile
    container_name: copilot-sandbox
    ports:
      - "4000:3000"
    env_file:
      - ./backend/.env
    environment:
      - PORT=3000
      - COPILOT_MODEL=${COPILOT_MODEL:-claude-opus-4.6}
    volumes:
      - sandbox-workspace:/workspace
    mem_limit: 4g
    cpus: 2.0
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/health"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

volumes:
  cosmos-data:
  sandbox-workspace:
