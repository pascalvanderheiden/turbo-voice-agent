<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Turbo Voice</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#0F0F1A;color:#fff;font-family:system-ui,-apple-system,sans-serif;height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1.5rem;padding:1rem;overflow:hidden}
.orb-wrap{position:relative;width:12rem;height:12rem;display:flex;align-items:center;justify-content:center}
.glow{position:absolute;inset:-0.5rem;border-radius:50%;background:radial-gradient(circle,rgba(233,30,140,0.25),rgba(123,47,190,0.15),rgba(0,212,255,0.1),transparent 70%);opacity:0.3;animation:breathe 3s ease-in-out infinite}
.wave{position:absolute;width:9rem;height:9rem;border-radius:50%;background:conic-gradient(from 0deg,#E91E8C,#7B2FBE,#00D4FF,#7B2FBE,#E91E8C);-webkit-mask:radial-gradient(circle,transparent 55%,black 56%);mask:radial-gradient(circle,transparent 55%,black 56%);opacity:0.15;animation:spin 6s linear infinite}
.core{position:relative;width:5.5rem;height:5.5rem;border-radius:50%;background:linear-gradient(135deg,#E91E8C,#7B2FBE,#00D4FF);box-shadow:0 0 25px rgba(233,30,140,0.3),0 0 50px rgba(123,47,190,0.15);z-index:1;display:flex;align-items:center;justify-content:center;animation:core-breathe 3s ease-in-out infinite}
.core svg{width:2rem;height:2rem;fill:rgba(255,255,255,0.9)}
.shine{position:absolute;inset:0.5rem;border-radius:50%;background:radial-gradient(circle at 35% 35%,rgba(255,255,255,0.3),transparent 60%);pointer-events:none}
body.listening .glow{animation:none;transform:scale(1.3);opacity:0.6}
body.listening .wave{animation:spin 1.2s linear infinite;opacity:0.7}
body.listening .core{animation:none;transform:scale(1.05)}
body.speaking .glow{animation:none;transform:scale(1.25);opacity:0.55}
body.speaking .wave{animation:spin 1.2s linear infinite;opacity:0.6;transform:scale(1.1)}
body.speaking .core{animation:none;transform:scale(1.06);box-shadow:0 0 40px rgba(0,212,255,0.4),0 0 70px rgba(233,30,140,0.2)}
body.connecting .glow{animation:breathe 1.5s ease-in-out infinite;opacity:0.4}
body.connecting .wave{animation:spin 2s linear infinite;opacity:0.4}
body.connecting .core{animation:pulse 1.2s ease-in-out infinite}
body.error .core{background:linear-gradient(135deg,#ef4444,#b91c1c)}
.status{font-size:0.8rem;color:#A0A0B8;min-height:1.25rem;text-align:center;padding:0 1rem;word-break:break-all}
.btn-row{display:flex;gap:0.75rem;align-items:center}
.btn-start{padding:0.75rem 1.5rem;border-radius:1.5rem;border:none;background:linear-gradient(135deg,#E91E8C,#7B2FBE);color:#fff;font-size:0.875rem;font-weight:600}
.btn-stop{padding:0.75rem 1.5rem;border-radius:1.5rem;border:1px solid rgba(239,68,68,0.3);background:rgba(239,68,68,0.15);color:#ef4444;font-size:0.875rem;font-weight:600}
.btn-eye{width:2.5rem;height:2.5rem;border-radius:50%;border:none;background:#252540;color:#6B6B80;font-size:1.2rem}
.transcript{width:100%;max-height:12rem;overflow-y:auto;display:flex;flex-direction:column;gap:0.4rem;padding:0 0.5rem}
.msg{max-width:85%;padding:0.4rem 0.8rem;border-radius:0.8rem;font-size:0.75rem;word-wrap:break-word}
.msg-user{align-self:flex-end;background:rgba(233,30,140,0.15)}
.msg-agent{align-self:flex-start;background:#252540}
.hidden{display:none!important}
@keyframes breathe{0%,100%{transform:scale(1)}50%{transform:scale(1.08)}}
@keyframes core-breathe{0%,100%{transform:scale(1)}50%{transform:scale(1.03)}}
@keyframes spin{from{rotate:0deg}to{rotate:360deg}}
@keyframes pulse{0%,100%{transform:scale(1);opacity:1}50%{transform:scale(1.05);opacity:0.85}}
</style>
</head>
<body>
<div class="orb-wrap"><div class="glow"></div><div class="wave"></div>
<div class="core" onclick="toggleVoice()"><div class="shine"></div>
<svg viewBox="0 0 24 24"><path d="M12 14a3 3 0 0 0 3-3V5a3 3 0 0 0-6 0v6a3 3 0 0 0 3 3zm5-3a5 5 0 0 1-10 0H5a7 7 0 0 0 6 6.92V21h2v-3.08A7 7 0 0 0 19 11h-2z"/></svg>
</div></div>
<div class="status" id="status">Tap the orb to start</div>
<div class="btn-row">
<button class="btn-start" id="btn" onclick="toggleVoice()">Start Voice</button>
<button class="btn-eye" onclick="toggleTx()">&#128065;</button>
</div>
<div class="transcript" id="tx"></div>
<script>
var WS_URL=location.origin.replace('https','wss').replace('http','ws')+'/ws/voice?lang=en';
var ws,ctx,stream,proc,active=false,pq=[],pt=0,playing=false;
var el=function(){return document.getElementById('status');};
function st(s){
  document.body.className=s||'';
  var b=document.getElementById('btn');
  if(!s){el().textContent='Tap the orb to start';b.className='btn-start';b.textContent='Start Voice';}
  else if(s==='connected'){el().textContent='Listening...';b.className='btn-stop';b.textContent='End Session';}
  else if(s==='listening'){el().textContent='Hearing you...';}
  else if(s==='speaking'){el().textContent='Turbo is responding...';}
}
function msg(r,t){var tx=document.getElementById('tx'),d=document.createElement('div');d.className='msg msg-'+r;d.textContent=t;tx.appendChild(d);tx.scrollTop=tx.scrollHeight;}
function toggleTx(){document.getElementById('tx').classList.toggle('hidden');}
function drain(){
  if(playing||!pq.length||!ctx)return;playing=true;
  (function go(){
    if(!pq.length){playing=false;return;}
    var b=pq.shift(),p=new Int16Array(b),f=new Float32Array(p.length);
    for(var i=0;i<p.length;i++)f[i]=p[i]/32768;
    var ab=ctx.createBuffer(1,f.length,24000);ab.getChannelData(0).set(f);
    var s=ctx.createBufferSource();s.buffer=ab;s.connect(ctx.destination);
    var n=ctx.currentTime,t=Math.max(n,pt);pt=t+ab.duration;s.start(t);s.onended=go;
  })();
}
function start(){
  active=true;
  el().textContent='[1/4] Requesting microphone...';
  document.body.className='connecting';
  if(!navigator.mediaDevices||!navigator.mediaDevices.getUserMedia){
    el().textContent='ERROR: mediaDevices not available (need HTTPS). Origin: '+location.origin;
    document.body.className='error';
    return;
  }
  navigator.mediaDevices.getUserMedia({audio:{sampleRate:24000,channelCount:1,echoCancellation:true}}).then(function(s){
    el().textContent='[2/4] Mic OK. Connecting WebSocket...';
    stream=s;ctx=new(window.AudioContext||window.webkitAudioContext)({sampleRate:24000});pt=0;
    var mic=ctx.createMediaStreamSource(stream);proc=ctx.createScriptProcessor(2048,1,1);
    el().textContent='[3/4] WS connecting to server...';
    ws=new WebSocket(WS_URL);
    ws.onopen=function(){el().textContent='[4/4] WS open, starting session...';};
    ws.onmessage=function(e){
      var m=JSON.parse(e.data);
      if(m.type==='session.ready'){
        st('connected');
        proc.onaudioprocess=function(ev){
          var inp=ev.inputBuffer.getChannelData(0),pcm=new Int16Array(inp.length);
          for(var i=0;i<inp.length;i++)pcm[i]=Math.max(-32768,Math.min(32767,inp[i]*32768));
          var bytes=new Uint8Array(pcm.buffer),bin='';
          for(var i=0;i<bytes.length;i++)bin+=String.fromCharCode(bytes[i]);
          if(ws&&ws.readyState===1)ws.send(JSON.stringify({type:'input_audio',audio:btoa(bin)}));
        };
        mic.connect(proc);proc.connect(ctx.destination);
      }else if(m.type==='input_audio_buffer.speech_started'){st('listening');pq=[];pt=0;}
      else if(m.type==='input_audio_buffer.speech_stopped'){st('connected');}
      else if(m.type==='input_audio_transcription.done'&&m.transcript){msg('user',m.transcript);}
      else if(m.type==='response.audio.delta'){
        st('speaking');var bin=atob(m.audio),ab=new Uint8Array(bin.length);
        for(var i=0;i<bin.length;i++)ab[i]=bin.charCodeAt(i);pq.push(ab.buffer);drain();
      }else if(m.type==='response.audio_transcript.done'&&m.transcript){msg('agent',m.transcript);}
      else if(m.type==='response.done'){st('connected');}
      else if(m.type==='error'){el().textContent='Server error';document.body.className='error';}
    };
    ws.onerror=function(){el().textContent='WS connection failed: '+WS_URL;document.body.className='error';};
    ws.onclose=function(ev){el().textContent='WS closed (code '+ev.code+')';if(active)stop();};
  }).catch(function(err){el().textContent='Mic error: '+err.name+' - '+err.message;document.body.className='error';});
}
function stop(){
  active=false;
  try{proc&&proc.disconnect();}catch(e){}
  try{stream&&stream.getTracks().forEach(function(t){t.stop();});}catch(e){}
  try{ctx&&ctx.close();}catch(e){}
  try{ws&&ws.close();}catch(e){}
  ws=null;ctx=null;stream=null;proc=null;pq=[];pt=0;playing=false;st('');
}
function toggleVoice(){if(active)stop();else start();}
</script>
</body>
</html>
