[project]
name = "turbo-voice-agent-backend"
version = "0.1.0"
description = "Turbo Voice Agent – FastAPI backend with Voice Live, Agent Framework, and Cosmos DB"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.34.0",
    "python-dotenv>=1.0.0",
    "python-multipart>=0.0.12",
    "azure-cosmos>=4.9.0",
    "azure-identity>=1.19.0",
    "azure-storage-blob>=12.24.0",
    "aiohttp>=3.11.0",
    "openai>=1.60.0",
    "pydantic>=2.10.0",
    "pyyaml>=6.0",
    "websockets>=14.0",
    "python-jose[cryptography]>=3.3.0",
    "playwright>=1.49.0",
    "pymupdf>=1.25.0",
    "Pillow>=11.0.0",
    "azure-mgmt-containerinstance>=10.1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24.0",
    "httpx>=0.28.0",
    "ruff>=0.8.0",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
