name: Deploy to Azure

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  detect-changes:
    name: Detect changes
    runs-on: ubuntu-latest
    outputs:
      infra: ${{ github.event_name == 'workflow_dispatch' || steps.filter.outputs.infra == 'true' }}
      app: ${{ github.event_name == 'workflow_dispatch' || steps.filter.outputs.app == 'true' }}
      sandbox: ${{ github.event_name == 'workflow_dispatch' || steps.filter.outputs.sandbox == 'true' }}
    steps:
      - uses: actions/checkout@v4

      - uses: dorny/paths-filter@v3
        id: filter
        if: github.event_name == 'push'
        with:
          filters: |
            infra:
              - 'infra/**'
              - 'azure.yaml'
            app:
              - 'backend/**'
              - 'frontend/**'
            sandbox:
              - 'sandbox/**'

  deploy:
    name: ${{ needs.detect-changes.outputs.infra == 'true' && 'Provision & Deploy' || 'Deploy' }}
    needs: detect-changes
    if: ${{ github.event_name == 'workflow_dispatch' || needs.detect-changes.outputs.infra == 'true' || needs.detect-changes.outputs.app == 'true' || needs.detect-changes.outputs.sandbox == 'true' }}
    runs-on: ubuntu-latest
    environment: ${{ vars.GITHUB_ENVIRONMENT_NAME || 'production' }}
    env:
      AZURE_ENV_NAME: ${{ vars.AZURE_ENV_NAME }}
      AZURE_LOCATION: ${{ vars.AZURE_LOCATION }}
      AZURE_SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Azure Developer CLI
        uses: Azure/setup-azd@v2

      - name: Log in to Azure (azd)
        run: |
          azd auth login \
            --client-id "${{ vars.AZURE_CLIENT_ID }}" \
            --federated-credential-provider "github" \
            --tenant-id "${{ vars.AZURE_TENANT_ID }}"

      - name: Log in to Azure (az CLI)
        uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Initialize azd environment
        run: |
          azd env new "$AZURE_ENV_NAME" \
            --subscription "$AZURE_SUBSCRIPTION_ID" \
            --location "$AZURE_LOCATION" \
            --no-prompt 2>/dev/null || true
          azd env refresh -e "$AZURE_ENV_NAME" --no-prompt
          # Ensure resource group is set (may be missing when latest deployment failed)
          azd env set AZURE_RESOURCE_GROUP "${{ vars.AZURE_RESOURCE_GROUP }}" -e "$AZURE_ENV_NAME"
          # azd deploy expects AZURE_CONTAINER_REGISTRY_ENDPOINT; Bicep outputs AZURE_CONTAINER_REGISTRY
          ACR=$(azd env get-value AZURE_CONTAINER_REGISTRY -e "$AZURE_ENV_NAME" 2>/dev/null || true)
          if [ -n "$ACR" ]; then
            azd env set AZURE_CONTAINER_REGISTRY_ENDPOINT "$ACR" -e "$AZURE_ENV_NAME"
          fi

      - name: Set Bicep parameters
        if: needs.detect-changes.outputs.infra == 'true'
        run: |
          azd env set ENTRA_TENANT_ID "${{ vars.ENTRA_TENANT_ID }}" -e "$AZURE_ENV_NAME"
          azd env set ENTRA_CLIENT_ID "${{ vars.ENTRA_CLIENT_ID }}" -e "$AZURE_ENV_NAME"
          azd env set CUSTOM_DOMAIN_NAME "${{ vars.CUSTOM_DOMAIN_NAME }}" -e "$AZURE_ENV_NAME"
          azd env set EXISTING_CERT_NAME "${{ vars.EXISTING_CERT_NAME }}" -e "$AZURE_ENV_NAME"
          azd env set DEPLOY_RBAC "${{ vars.DEPLOY_RBAC || 'true' }}" -e "$AZURE_ENV_NAME"
          if [ -n "${{ vars.DEPLOYER_PRINCIPAL_ID }}" ]; then
            azd env set DEPLOYER_PRINCIPAL_ID "${{ vars.DEPLOYER_PRINCIPAL_ID }}" -e "$AZURE_ENV_NAME"
          fi
          if [ -n "${{ secrets.ENTRA_CLIENT_SECRET }}" ]; then
            azd env set ENTRA_CLIENT_SECRET "${{ secrets.ENTRA_CLIENT_SECRET }}" -e "$AZURE_ENV_NAME"
          fi

      - name: Provision infrastructure
        if: needs.detect-changes.outputs.infra == 'true'
        run: azd provision -e "$AZURE_ENV_NAME" --no-prompt

      - name: Configure sandbox ACR registry
        if: needs.detect-changes.outputs.infra == 'true'
        run: |
          # After provision + RBAC, configure ACR registry on sandbox
          # (not done in Bicep to avoid chicken-and-egg with AcrPull role)
          SANDBOX_NAME=$(az containerapp list -g "${{ vars.AZURE_RESOURCE_GROUP }}" \
            --query "[?tags.\"azd-service-name\"=='sandbox'].name" -o tsv)
          ACR=$(azd env get-value AZURE_CONTAINER_REGISTRY -e "$AZURE_ENV_NAME" 2>/dev/null || true)
          if [ -n "$SANDBOX_NAME" ] && [ -n "$ACR" ]; then
            az containerapp registry set -n "$SANDBOX_NAME" \
              -g "${{ vars.AZURE_RESOURCE_GROUP }}" \
              --server "$ACR" --identity system
          fi

      - name: Prepare deploy environment
        run: |
          # Re-bridge variables that provision may have overwritten
          azd env set AZURE_RESOURCE_GROUP "${{ vars.AZURE_RESOURCE_GROUP }}" -e "$AZURE_ENV_NAME"
          ACR=$(azd env get-value AZURE_CONTAINER_REGISTRY -e "$AZURE_ENV_NAME" 2>/dev/null || true)
          if [ -n "$ACR" ]; then
            azd env set AZURE_CONTAINER_REGISTRY_ENDPOINT "$ACR" -e "$AZURE_ENV_NAME"
          fi
          # Write build stamp to bust Docker COPY cache
          echo "$(date +%s)-$(git rev-parse --short HEAD)" > backend/.build-stamp
          echo "$(date +%s)-$(git rev-parse --short HEAD)" > frontend/.build-stamp

      - name: Deploy applications
        run: azd deploy -e "$AZURE_ENV_NAME" --no-prompt
