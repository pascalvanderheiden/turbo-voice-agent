name: turbo-voice-agent
metadata:
  template: turbo-voice-agent

infra:
  provider: bicep
  path: infra
  module: main
  # Infrastructure parameters are resolved from azd environment values via infra/main.parameters.json.
  # Required: ENTRA_TENANT_ID, ENTRA_CLIENT_ID
  # Optional: ENTRA_CLIENT_SECRET, CUSTOM_DOMAIN_NAME, EXISTING_CERT_NAME,
  #           DEPLOYER_PRINCIPAL_ID, DEPLOY_RBAC

pipeline:
  # Additional GitHub Actions variables used by .github/workflows/deploy.yml.
  # Core Azure variables (AZURE_CLIENT_ID, AZURE_TENANT_ID, AZURE_SUBSCRIPTION_ID,
  # AZURE_ENV_NAME, AZURE_LOCATION) are populated by azd pipeline config.
  variables:
    - AZURE_RESOURCE_GROUP
    - ENTRA_TENANT_ID
    - ENTRA_CLIENT_ID
    - CUSTOM_DOMAIN_NAME
    - EXISTING_CERT_NAME
    - DEPLOY_RBAC
    - DEPLOYER_PRINCIPAL_ID
    - GITHUB_ENVIRONMENT_NAME
    - AZURE_OPENAI_LOCATION_PRIMARY
    - AZURE_OPENAI_LOCATION_VOICE
    - AZURE_OPENAI_LOCATION_RESEARCH
  secrets:
    - ENTRA_CLIENT_SECRET

services:
  backend:
    host: containerapp
    project: ./backend
    language: python
    docker:
      path: ./Dockerfile
      context: .
      remoteBuild: true

  frontend:
    host: containerapp
    project: ./frontend
    language: js
    docker:
      path: ./Dockerfile
      context: .
      remoteBuild: true

# NOTE: The sandbox image is NOT an azd service.
# - There is no Container App for the sandbox; the Azure Container Apps dynamic
#   session pool (sp-sandbox-*, see infra/modules/session-pool.bicep) pulls the
#   image directly from ACR at session-allocate time.
# - The image is built and pushed to ACR by `infra/scripts/build-sandbox-image.sh`
#   via the `postprovision` hook below, producing the tag
#   `${ACR}/turbo-voice-agent/sandbox:latest` that the pool references.
# - Declaring `host: containerapp` here previously caused 20-minute "Operation
#   expired" failures because azd looked for a non-existent ca-sandbox-* revision.

hooks:
  preprovision:
    posix:
      shell: sh
      interactive: true
      run: |
        bash infra/scripts/collect-deployment-params.sh
        bash infra/scripts/select-model-regions.sh
        bash infra/scripts/setup-entra-app.sh
        # Rebuild sandbox image BEFORE the session pool is (re)deployed so the
        # pool always pulls a current image whose /health + /ready endpoints
        # match the probes in session-pool.bicep. No-op on first ever run
        # (script exits 0 when AZURE_CONTAINER_REGISTRY is unset). Prevents
        # the chicken-and-egg where a failed pool blocks postprovision (which
        # builds the image), leaving :latest stale forever.
        bash infra/scripts/build-sandbox-image.sh
    windows:
      shell: pwsh
      interactive: true
      run: |
        bash infra/scripts/collect-deployment-params.sh
        bash infra/scripts/select-model-regions.sh
        bash infra/scripts/setup-entra-app.sh
        bash infra/scripts/build-sandbox-image.sh

  postprovision:
    posix:
      shell: sh
      run: |
        echo "Provisioning complete."
        echo "Backend URL: ${BACKEND_URL}"
        echo "Frontend URL: ${FRONTEND_URL}"
        FRONTEND_URL="${FRONTEND_URL}" bash infra/scripts/setup-entra-app.sh
        bash infra/scripts/build-sandbox-image.sh
        # Seed the `skills` blob container with .github/skills/ so freshly
        # warmed sandbox sessions have platform skills available on first
        # request. Idempotent; safe to re-run.
        bash infra/scripts/upload-skills.sh
    windows:
      shell: pwsh
      run: |
        Write-Host "Provisioning complete."
        Write-Host "Backend URL: $env:BACKEND_URL"
        Write-Host "Frontend URL: $env:FRONTEND_URL"
        bash infra/scripts/setup-entra-app.sh
        bash infra/scripts/build-sandbox-image.sh
        bash infra/scripts/upload-skills.sh

  postdeploy:
    shell: sh
    run: bash infra/scripts/build-sandbox-image.sh
