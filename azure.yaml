name: turbo-voice-agent
metadata:
  template: turbo-voice-agent

infra:
  provider: bicep
  path: infra
  module: main
  # Infrastructure parameters are resolved from azd environment values via infra/main.parameters.json.
  # Required: ENTRA_TENANT_ID, ENTRA_CLIENT_ID
  # Optional: ENTRA_CLIENT_SECRET, CUSTOM_DOMAIN_NAME, EXISTING_CERT_NAME,
  #           DEPLOYER_PRINCIPAL_ID, DEPLOY_RBAC

pipeline:
  # Additional GitHub Actions variables used by .github/workflows/deploy.yml.
  # Core Azure variables (AZURE_CLIENT_ID, AZURE_TENANT_ID, AZURE_SUBSCRIPTION_ID,
  # AZURE_ENV_NAME, AZURE_LOCATION) are populated by azd pipeline config.
  variables:
    - AZURE_RESOURCE_GROUP
    - ENTRA_TENANT_ID
    - ENTRA_CLIENT_ID
    - CUSTOM_DOMAIN_NAME
    - EXISTING_CERT_NAME
    - DEPLOY_RBAC
    - DEPLOYER_PRINCIPAL_ID
    - GITHUB_ENVIRONMENT_NAME
    - AZURE_OPENAI_LOCATION_PRIMARY
    - AZURE_OPENAI_LOCATION_VOICE
    - AZURE_OPENAI_LOCATION_RESEARCH
  secrets:
    - ENTRA_CLIENT_SECRET

services:
  backend:
    host: containerapp
    project: ./backend
    language: python
    docker:
      path: ./Dockerfile
      context: .
      remoteBuild: true

  frontend:
    host: containerapp
    project: ./frontend
    language: js
    docker:
      path: ./Dockerfile
      context: .
      remoteBuild: true

  sandbox:
    # Builds & pushes the sandbox image to ACR. The image is pulled by the
    # Azure Container Apps dynamic session pool (sp-sandbox-*) — see
    # infra/modules/session-pool.bicep. NOTE: azd's `containerapp` host still
    # expects a Container App target; the image push to ACR is what we depend
    # on. tag-sandbox-latest.sh promotes the pushed image to `:latest` so the
    # pool's `${ACR}/turbo-voice-agent/sandbox:latest` reference resolves.
    host: containerapp
    project: ./sandbox
    language: js
    docker:
      path: ./Dockerfile
      context: .
      remoteBuild: true

hooks:
  preprovision:
    posix:
      shell: sh
      interactive: true
      run: |
        bash infra/scripts/collect-deployment-params.sh
        bash infra/scripts/select-model-regions.sh
        bash infra/scripts/setup-entra-app.sh
    windows:
      shell: pwsh
      interactive: true
      run: |
        bash infra/scripts/collect-deployment-params.sh
        bash infra/scripts/select-model-regions.sh
        bash infra/scripts/setup-entra-app.sh

  postprovision:
    posix:
      shell: sh
      run: |
        echo "Provisioning complete."
        echo "Backend URL: ${BACKEND_URL}"
        echo "Frontend URL: ${FRONTEND_URL}"
        FRONTEND_URL="${FRONTEND_URL}" bash infra/scripts/setup-entra-app.sh
    windows:
      shell: pwsh
      run: |
        Write-Host "Provisioning complete."
        Write-Host "Backend URL: $env:BACKEND_URL"
        Write-Host "Frontend URL: $env:FRONTEND_URL"
        bash infra/scripts/setup-entra-app.sh

  postdeploy:
    shell: sh
    run: bash infra/scripts/tag-sandbox-latest.sh
